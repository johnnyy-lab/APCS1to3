<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{UNIT_FULL_TITLE}} | APCS 教學投影片</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/slide-core.css">
</head>
<body>

  <!-- 最上方導航控制列 -->
  <div class="deck-topbar">
    <div class="select-group">
      <span class="select-label">選擇章節：</span>
      <select class="nav-select" id="chapterSelect" onchange="onChapterChange()"></select>
      <select class="nav-select" id="sectionSelect" onchange="onSectionChange()"></select>
    </div>

    <div class="deck-actions" id="deckActions">
      <button class="btn btn-theme-toggle" id="btnThemeToggle" onclick="toggleTheme()">
        切換為 IDLE 考場風格
      </button>
      <button class="btn" id="btnPrev" onclick="prevSlide()">
        <span class="key-badge">◀</span> 上一頁
      </button>
      <button class="btn" id="btnNext" onclick="nextSlide()">
        下一頁 <span class="key-badge">▶</span>
      </button>
      <button class="btn" onclick="toggleFullscreen()">
        全螢幕投影
      </button>
    </div>
    <!-- 頂部細緻進度線 (agytodo 5.2) -->
    <div class="topbar-progress-line" id="topbarProgressLine"></div>
  </div>

  <!-- 16:9 投影片畫布 -->
  <div class="slide-stage" id="slideStage">
    
    <!-- 頂部 Header：雙行左主標題 + 雙行右章節目 -->
    <header class="slide-header" id="slideHeader">
      <div class="header-left">
        <h1 class="title-chinese" id="titleChinese">載入中...</h1>
        <div class="title-english" id="titleEnglish">Loading...</div>
      </div>
      <div class="header-right">
        <div class="breadcrumb-chapter" id="breadcrumbChapter">章節名稱</div>
        <div class="breadcrumb-section" id="breadcrumbSection">小節名稱</div>
      </div>
    </header>

    <!-- 三部分主體 -->
    <main class="slide-body" id="slideBody">
      <section class="left-column">
        <!-- 1. 教學程式碼 -->
        <article class="card-code">
          <div class="card-header">
            <span>教學程式碼</span>
            <span class="current-theme-pill" id="themePill">Colab 深色風格</span>
          </div>
          <div class="code-viewport" id="codeViewport"></div>
          <div class="code-line-bar" id="codeLineBar"></div>
        </article>

        <!-- 2. 執行結果 -->
        <article class="card-output">
          <div class="output-header">
            <span>執行結果</span>
            <span style="font-size: 11px;">純結果輸出</span>
          </div>
          <div class="output-viewport-wrap">
            <div class="output-viewport" id="outputViewport"></div>
            <!-- 主動預測遮罩與二擇一預測卡 (agytodo 3.2, 3.3) -->
            <div class="prediction-overlay" id="predictionOverlay" style="display: none;" onclick="revealPrediction(event)">
              <div class="prediction-badge">🧠 點擊揭曉預測答案</div>
              <div class="prediction-hint">或按鍵盤 ▶ / 點擊「揭曉答案」解鎖</div>
            </div>
          </div>
        </article>
      </section>

      <!-- 3. 重點說明 -->
      <aside class="card-notes">
        <div>
          <div class="notes-header">
            <h2 class="notes-title">重點說明</h2>
          </div>
          <ul class="notes-list" id="notesList"></ul>

          <!-- 📦 記憶體狀態盒容器 (Mental Model Widget) -->
          <div class="memory-stage" id="memoryStage" style="display: none;">
            <div class="memory-stage-header">
              <span class="memory-title">📦 記憶體置物箱狀態 (Memory State)</span>
              <span class="memory-hint">門牌與數值</span>
            </div>
            <div class="memory-boxes-container" id="memoryBoxesContainer"></div>
          </div>

          <!-- 🏆 單元通關徽章與實戰卡片 (agytodo 5.3) -->
          <div class="completion-card" id="completionCard" style="display: none;"></div>
        </div>

        <div class="slide-footer">
          <!-- 微進度指示點 (agytodo 5.2) -->
          <div class="milestone-dots" id="milestoneDots"></div>
          <div class="page-indicator" id="pageIndicator">1 / 1</div>
        </div>
      </aside>
    </main>

    <!-- 跨卡片數據流向平滑導引線 (agytodo 6.1) -->
    <svg class="flow-guide-svg" id="flowGuideSvg" aria-hidden="true">
      <defs>
        <linearGradient id="flowLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
          <stop offset="100%" stop-color="#06b6d4" stop-opacity="1" />
        </linearGradient>
        <linearGradient id="flowLineGradErr" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.95" />
          <stop offset="100%" stop-color="#e11d48" stop-opacity="1" />
        </linearGradient>
        <marker id="flowArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4" />
        </marker>
        <marker id="flowArrowErr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
        </marker>
        <marker id="flowArrowIdle" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
        </marker>
      </defs>
      <path id="flowGuidePath" class="flow-guide-path" d="" />
      <circle id="flowGuideStartDot" class="flow-guide-start-dot" r="4" cx="-999" cy="-999" />
      <circle id="flowGuideDot" class="flow-guide-dot" r="4.5" cx="-999" cy="-999" />
    </svg>

    <!-- 施工中展示區塊 -->
    <section class="construction-stage" id="constructionStage">
      <div class="construction-icon-wrap">
        <svg class="construction-spinner" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </div>
      <h2 class="construction-title">🚧 內容施工中，敬請期待！</h2>
      <div class="construction-target" id="constructionTarget">指定單元</div>
      <p class="construction-desc">
        本單元教學投影片正在緊鑼密鼓加速製作中！<br>
        我們將持續遵循「任何微小變化即單獨一頁」與「APCS 考場 IDLE 雙模切換」標準，為您呈現最高質量的自學簡報。
      </p>
      <button class="btn-return-demo" onclick="returnToDemoUnit()">
        <span>👈 返回當前單元投影片觀看示範</span>
      </button>
    </section>
  </div>

  <!-- 行動端常駐拇指控制列 (Mobile Thumb Control Dock) -->
  <div class="mobile-bottom-dock" id="mobileBottomDock">
    <button class="dock-btn" id="dockBtnPrev" onclick="prevSlide()" aria-label="上一頁">
      <span>◀</span>
      <span>上一頁</span>
    </button>
    <div class="dock-page-indicator" id="dockPageIndicator">1 / 1</div>
    <button class="dock-btn dock-btn-primary" id="dockBtnNext" onclick="nextSlide()" aria-label="下一頁">
      <span>下一頁</span>
      <span>▶</span>
    </button>
    <button class="dock-btn dock-btn-theme" onclick="toggleTheme()" aria-label="切換風格" title="切換考場/Colab風格">
      <span id="dockThemeIcon">🏛️ 考場</span>
    </button>
  </div>
