<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單元 1.1 變數命名規則與記憶體參照概念 | APCS 教學投影片</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       CSS Variables & Global Themes
       ========================================================================== */
    :root {
      --bg-page: #0b0f19;
      --slide-bg: #f8fafc;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);

      --primary: #0284c7;
      --primary-light: #e0f2fe;
      --accent-danger: #ef4444;
      --accent-success: #10b981;
      --accent-amber: #f59e0b;

      /* Colab 深色風格 (預設) */
      --code-bg: #1e1e2e;
      --code-text: #cdd6f4;
      --code-line-num: #6c7086;
      --code-border: #313244;
      --output-bg: #0f172a;
      --output-text: #f8fafc;
      --output-border: #1e293b;
      --output-header-bg: #1e293b;
      --output-header-text: #94a3b8;
      --diff-bg: rgba(14, 165, 233, 0.18);
      --diff-border: #0ea5e9;
      --err-bg: rgba(239, 68, 68, 0.2);
      --err-border: #ef4444;
      --linked-bg: rgba(56, 189, 248, 0.25);
      --linked-border: #38bdf8;
    }

    /* IDLE 考場樣式 (白底純黑字 + 考場純淨風格) */
    body.idle-theme {
      --code-bg: #ffffff;
      --code-text: #000000;
      --code-line-num: #888888;
      --code-border: #d1d5db;
      --output-bg: #ffffff;
      --output-text: #0000cd; /* IDLE 標準輸出經典深藍色 */
      --output-border: #d1d5db;
      --output-header-bg: #f3f4f6;
      --output-header-text: #4b5563;
      --diff-bg: #f1f5f9;
      --diff-border: #475569;
      --err-bg: #fef2f2;
      --err-border: #dc2626;
      --linked-bg: #dbeafe;
      --linked-border: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      color: var(--text-dark);
      overflow-x: hidden;
      transition: background-color 0.25s ease;
    }

    /* ==========================================================================
       最上方導航控制列 (全15章/118節下拉選單 + 風格切換按鈕 + 翻頁按鈕)
       ========================================================================== */
    .deck-topbar {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: #94a3b8;
      font-size: 13px;
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-label {
      font-weight: 600;
      color: #cbd5e1;
      font-size: 13px;
    }

    .nav-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      max-width: 320px;
      transition: border-color 0.2s;
    }

    .nav-select:hover, .nav-select:focus {
      border-color: #38bdf8;
    }

    .deck-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .btn:hover {
      background: #334155;
      border-color: #64748b;
    }

    .btn-theme-toggle {
      background: #0369a1;
      border-color: #0284c7;
      color: #ffffff;
      font-weight: 600;
    }
    .btn-theme-toggle:hover {
      background: #0284c7;
    }
    body.idle-theme .btn-theme-toggle {
      background: #475569;
      border-color: #64748b;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .key-badge {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #38bdf8;
    }

    /* ==========================================================================
       16:9 Slide Canvas 主畫布
       ========================================================================== */
    .slide-stage {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: var(--slide-bg);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 26px 36px 18px 36px;
    }

    /* 頂部 Header：左側主標題（雙行），右側章節目（雙行） */
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .title-chinese {
      font-size: 26px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .title-english {
      font-size: 14px;
      font-weight: 500;
      color: #64748b;
      font-family: 'JetBrains Mono', sans-serif;
      letter-spacing: 0.01em;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      text-align: right;
    }

    .breadcrumb-chapter {
      font-size: 14px;
      font-weight: 700;
      color: #0369a1;
      background: #e0f2fe;
      padding: 2px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .breadcrumb-section {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
    }

    /* ==========================================================================
       三部分主體架構 (3 Parts Layout)
       ========================================================================== */
    .slide-body {
      display: grid;
      grid-template-columns: 57% 43%;
      grid-template-rows: 1fr;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }

    .left-column {
      display: grid;
      grid-template-rows: 64% 36%;
      gap: 12px;
      min-height: 0;
    }

    /* Part 1: 教學程式碼 Card */
    .card-code {
      background: var(--code-bg);
      border-radius: 12px;
      border: 1px solid var(--code-border);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }

    .card-header {
      padding: 8px 16px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      border-top-left-radius: 11px;
      border-top-right-radius: 11px;
    }
    body.idle-theme .card-header {
      background: #f3f4f6;
      border-bottom: 1px solid #d1d5db;
    }

    .current-theme-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #0284c7;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
    }
    body.idle-theme .current-theme-pill {
      background: #475569;
      color: #ffffff;
    }

    .code-viewport {
      flex: 1;
      padding: 10px 16px;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.6;
      overflow: visible;
      color: var(--code-text);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 程式碼每行與懸停說明 */
    .code-line {
      display: flex;
      align-items: center;
      min-height: 28px;
      border-radius: 4px;
      padding: 0 8px;
      position: relative;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .code-line:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }
    body.idle-theme .code-line:hover {
      background-color: #f1f5f9;
    }

    .line-num {
      width: 28px;
      text-align: right;
      margin-right: 14px;
      color: var(--code-line-num);
      user-select: none;
      font-weight: 500;
      font-size: 13px;
    }

    .line-content {
      flex: 1;
      white-space: pre;
    }

    /* 語法高亮 (深色模式) */
    .token-keyword { color: #cba6f7; font-weight: 600; }
    .token-func { color: #89b4fa; }
    .token-number { color: #fab387; font-weight: 600; }
    .token-string { color: #a6e3a1; }
    .token-comment { color: #94a3b8; font-style: italic; }
    .token-op { color: #89dceb; }
    .token-ident { color: #cdd6f4; }

    /* IDLE 模式：完全移除彩色高亮，呈現純黑字 */
    body.idle-theme .code-viewport .line-content * {
      color: #000000 !important;
      text-shadow: none !important;
    }
    body.idle-theme .line-num {
      color: #888888 !important;
    }
    body.idle-theme .token-comment {
      color: #555555 !important;
    }

    /* 變化行 / 錯誤行高亮 */
    .code-line.diff-highlight {
      background: var(--diff-bg);
      border-left: 4px solid var(--diff-border);
      padding-left: 4px;
    }
    .code-line.error-highlight {
      background: var(--err-bg);
      border-left: 4px solid var(--err-border);
      padding-left: 4px;
    }

    /* 聯動高亮（滑鼠移到右側重點說明時，左側程式碼高亮） */
    .code-line.linked-highlight {
      background: var(--linked-bg) !important;
      border-left: 4px solid var(--linked-border) !important;
      box-shadow: 0 0 10px rgba(14, 165, 233, 0.35) !important;
      padding-left: 4px;
    }

    /* 浮動氣泡框 (Tooltip) */
    .line-tooltip {
      position: absolute;
      left: 36px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Noto Sans TC', sans-serif;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      z-index: 100;
      white-space: normal;
      width: 440px;
      line-height: 1.55;
      display: none;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #38bdf8;
    }

    /* 向上展開 */
    .line-tooltip.tooltip-up {
      bottom: calc(100% + 8px);
    }
    .line-tooltip.tooltip-up::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 18px;
      border-width: 6px;
      border-style: solid;
      border-color: #38bdf8 transparent transparent transparent;
    }

    /* 向下展開（避免前兩行被頂部邊界切掉） */
    .line-tooltip.tooltip-down {
      top: calc(100% + 8px);
    }
    .line-tooltip.tooltip-down::after {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 18px;
      border-width: 6px;
      border-style: solid;
      border-color: transparent transparent #38bdf8 transparent;
    }

    .code-line:hover .line-tooltip {
      display: block;
    }

    /* IDLE 模式下的浮動氣泡框 */
    body.idle-theme .line-tooltip {
      background: #ffffff !important;
      color: #0f172a !important;
      border: 1px solid #64748b !important;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.08) !important;
    }
    body.idle-theme .line-tooltip.tooltip-up::after {
      border-color: #64748b transparent transparent transparent !important;
    }
    body.idle-theme .line-tooltip.tooltip-down::after {
      border-color: transparent transparent #64748b transparent !important;
    }

    .line-tooltip .tt-header {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
      font-size: 13px;
    }
    body.idle-theme .line-tooltip .tt-header {
      color: #0284c7 !important;
    }
    .line-tooltip .tt-row {
      margin-bottom: 3px;
    }
    .line-tooltip .tt-tag {
      font-weight: 700;
      color: #f59e0b;
      margin-right: 4px;
    }
    body.idle-theme .line-tooltip .tt-tag {
      color: #b45309 !important;
    }
    body.idle-theme .line-tooltip span {
      color: #1e293b !important;
    }

    /* 底部三維解析條 */
    .code-line-bar {
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid var(--code-border);
      font-size: 12px;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 52px;
      border-bottom-left-radius: 11px;
      border-bottom-right-radius: 11px;
      justify-content: center;
    }
    body.idle-theme .code-line-bar {
      background: #f8fafc;
      color: #334155;
      border-top: 1px solid #e2e8f0;
    }

    .bar-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      line-height: 1.4;
    }
    .bar-badge {
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
      flex-shrink: 0;
    }
    .badge-mean { background: #0284c7; color: #ffffff; }
    .badge-why { background: #059669; color: #ffffff; }
    .badge-alt { background: #d97706; color: #ffffff; }

    /* Part 2: 執行結果 Card (純輸出，無終端提示符號) */
    .card-output {
      background: var(--output-bg);
      border-radius: 12px;
      border: 1px solid var(--output-border);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s, border-color 0.2s;
    }

    .output-header {
      padding: 5px 14px;
      background: var(--output-header-bg);
      border-bottom: 1px solid var(--output-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--output-header-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .output-viewport {
      flex: 1;
      padding: 10px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.5;
      color: var(--output-text);
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .output-empty {
      color: #64748b;
      font-style: italic;
      font-size: 13px;
    }
    body.idle-theme .output-empty {
      color: #9ca3af;
    }

    .output-error {
      color: #ef4444;
      font-weight: 600;
    }
    body.idle-theme .output-error {
      color: #dc2626; /* IDLE 報錯紅色 */
    }

    /* Part 3: 重點說明 Card */
    .card-notes {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 18px 22px;
      justify-content: space-between;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f1f5f9;
    }

    .notes-title {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
    }

    .notes-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .note-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 15px;
      line-height: 1.55;
      color: #1e293b;
      font-weight: 500;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .note-item:hover {
      background: #f1f5f9;
      transform: translateX(3px);
    }

    .line-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: #0284c7;
      color: #ffffff;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .line-badge.error-badge { background: #ef4444; }
    .line-badge.concept-badge { background: #64748b; }

    .code-inline {
      font-family: 'JetBrains Mono', monospace;
      background: #f1f5f9;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.9em;
      color: #0284c7;
      font-weight: 600;
      border: 1px solid #e2e8f0;
    }

    .slide-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 10px;
    }

    .page-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #0f172a;
      background: #f1f5f9;
      padding: 3px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    /* 施工中狀態卡片 */
    .construction-stage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      padding: 40px 20px;
    }

    .construction-icon-wrap {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25);
      position: relative;
    }

    .construction-spinner {
      animation: rotate-gear 6s linear infinite;
      transform-origin: center;
    }

    @keyframes rotate-gear {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .construction-title {
      font-size: 28px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .construction-target {
      font-size: 17px;
      font-weight: 700;
      color: #0284c7;
      background: #e0f2fe;
      padding: 4px 16px;
      border-radius: 9999px;
      margin-bottom: 16px;
      display: inline-block;
    }

    .construction-desc {
      font-size: 15px;
      color: #64748b;
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn-return-demo {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: all 0.2s ease;
    }
    .btn-return-demo:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- 最上方導航控制列 -->
  <div class="deck-topbar">
    <div class="select-group">
      <span class="select-label">選擇章節：</span>
      <select class="nav-select" id="chapterSelect" onchange="onChapterChange()"></select>
      <select class="nav-select" id="sectionSelect" onchange="onSectionChange()"></select>
    </div>

    <div class="deck-actions" id="deckActions">
      <button class="btn btn-theme-toggle" id="btnThemeToggle" onclick="toggleTheme()">
        切換為 IDLE 考場風格
      </button>
      <button class="btn" id="btnPrev" onclick="prevSlide()">
        <span class="key-badge">◀</span> 上一頁
      </button>
      <button class="btn" id="btnNext" onclick="nextSlide()">
        下一頁 <span class="key-badge">▶</span>
      </button>
      <button class="btn" onclick="toggleFullscreen()">
        全螢幕投影
      </button>
    </div>
  </div>

  <!-- 16:9 投影片畫布 -->
  <div class="slide-stage" id="slideStage">
    
    <!-- 頂部 Header：雙行左主標題 + 雙行右章節目 -->
    <header class="slide-header" id="slideHeader">
      <div class="header-left">
        <h1 class="title-chinese" id="titleChinese">建立變數與放入數值</h1>
        <div class="title-english" id="titleEnglish">Variable Declaration & Initial Value</div>

    let currentSlide = 0;
    let isIdleTheme = false;

    /* 主題持久化引擎：預設 Colab 深色風格，但若該次 session 切換過則保持 */
    function initThemeFromSession() {
      const savedTheme = sessionStorage.getItem('apcs_slide_theme');
      if (savedTheme === 'idle') {
        setTheme(true);
      } else {
        setTheme(false); // 預設 Colab 深色風格
      }
    }

    function setTheme(toIdle) {
      isIdleTheme = toIdle;
      const body = document.body;
      const btn = document.getElementById('btnThemeToggle');
      const pill = document.getElementById('themePill');

      if (isIdleTheme) {
        body.classList.add('idle-theme');
        if (btn) btn.textContent = "切換為 Colab 深色風格";
        if (pill) pill.textContent = "IDLE 考場風格 (白底黑字)";
        sessionStorage.setItem('apcs_slide_theme', 'idle');
      } else {
        body.classList.remove('idle-theme');
        if (btn) btn.textContent = "切換為 IDLE 考場風格";
        if (pill) pill.textContent = "Colab 深色風格";
        sessionStorage.setItem('apcs_slide_theme', 'colab');
      }
    }

    function toggleTheme() {
      setTheme(!isIdleTheme);
    }

    /* 初始化章節下拉式選單 */
    function initCurriculumSelects() {
      const chSelect = document.getElementById('chapterSelect');
      chSelect.innerHTML = '';

      courseCurriculum.forEach(ch => {
        const opt = document.createElement('option');
        opt.value = ch.id;
        opt.textContent = ch.title;
        chSelect.appendChild(opt);
      });

      chSelect.value = 'ch1';
      populateSections('ch1');
    }

    function populateSections(chapterId) {
      const secSelect = document.getElementById('sectionSelect');
      secSelect.innerHTML = '';
      const chapter = courseCurriculum.find(c => c.id === chapterId);
      if (!chapter) return;

      chapter.sections.forEach(sec => {
        const opt = document.createElement('option');
        opt.value = sec.id;
        opt.textContent = (sec.available ? '✅ ' : '⏳ ') + sec.title;
        secSelect.appendChild(opt);
      });

      secSelect.value = chapter.sections[0].id;
      handleSectionSelection(chapter.sections[0].id);
    }

    function onChapterChange() {
      const chapterId = document.getElementById('chapterSelect').value;
      populateSections(chapterId);
    }

    function onSectionChange() {
      const sectionId = document.getElementById('sectionSelect').value;
      handleSectionSelection(sectionId);
    }

    /* 處理節選定 */
    function handleSectionSelection(sectionId) {
      const slideHeader = document.getElementById('slideHeader');
      const slideBody = document.getElementById('slideBody');
      const constructionStage = document.getElementById('constructionStage');
      const deckActions = document.getElementById('deckActions');

      if (sectionId === 'sec1-1') {
        slideHeader.style.display = 'flex';
        slideBody.style.display = 'grid';
        constructionStage.style.display = 'none';
        deckActions.style.visibility = 'visible';

        currentSlide = 0;
        renderSlide(0);
      } else {
        slideHeader.style.display = 'none';
        slideBody.style.display = 'none';
        constructionStage.style.display = 'flex';
        deckActions.style.visibility = 'hidden';

        const chapterId = document.getElementById('chapterSelect').value;
        const chapter = courseCurriculum.find(c => c.id === chapterId);
        const section = chapter ? chapter.sections.find(s => s.id === sectionId) : null;
        const targetTitle = section ? section.title : '指定單元';
        document.getElementById('constructionTarget').textContent = targetTitle;
      }
    }

    function returnToDemoUnit() {
      document.getElementById('chapterSelect').value = 'ch1';
      populateSections('ch1');
      document.getElementById('sectionSelect').value = 'sec1-1';
      handleSectionSelection('sec1-1');
    }

    function renderSlide(index) {
      const slide = slidesData[index];

      // Header 雙行
      document.getElementById('titleChinese').textContent = slide.titleZh;
      document.getElementById('titleEnglish').textContent = slide.titleEn;
      document.getElementById('breadcrumbChapter').textContent = slide.chapter;
      document.getElementById('breadcrumbSection').textContent = slide.section;

      // 教學程式碼與懸停提示（行號 <= 2 向下展開避免切邊）
      const codeViewport = document.getElementById('codeViewport');
      codeViewport.innerHTML = slide.codeLines.map(line => {
        const diffClass = line.diff ? 'diff-highlight' : (line.error ? 'error-highlight' : '');
        const tooltipPositionClass = (line.num <= 2) ? 'tooltip-down' : 'tooltip-up';
        return `
          <div class="code-line ${diffClass}" id="code-line-${line.num}"
               onmouseenter="onLineHover(${line.num})"
               onmouseleave="onLineLeave()">
            <span class="line-num">${line.num}</span>
            <span class="line-content">${line.html}</span>
            <div class="line-tooltip ${tooltipPositionClass}">
              <div class="tt-header">📌 第 ${line.num} 行代碼解析</div>
              <div class="tt-row"><span class="tt-tag">【白話含義】</span><span>${line.mean}</span></div>
              <div class="tt-row"><span class="tt-tag">【為何這樣寫】</span><span>${line.why}</span></div>
              <div class="tt-row"><span class="tt-tag">【還可以怎麼寫】</span><span>${line.alt}</span></div>
            </div>
          </div>
        `;
      }).join('');

      // 執行結果 (純結果輸出，無終端機提示符號)
      document.getElementById('outputViewport').innerHTML = slide.output;

      // 重點說明 (支援滑鼠移入時，聯動高亮對應程式碼行)
      const notesList = document.getElementById('notesList');
      notesList.innerHTML = slide.notes.map(n => {
        const badgeClass = n.type === 'error' ? 'error-badge' : (n.type === 'concept' ? 'concept-badge' : '');
        const linesJson = JSON.stringify(n.lines);
        return `
          <li class="note-item" 
              onmouseenter='highlightLines(${linesJson})'
              onmouseleave='clearHighlightedLines()'>
            <span class="line-badge ${badgeClass}">${n.lineText}</span>
            <div>${n.text}</div>
          </li>
        `;
      }).join('');

      // 頁碼
      const pageStr = `${index + 1} / ${slidesData.length}`;
      document.getElementById('pageIndicator').textContent = pageStr;

      // 按鈕狀態
      document.getElementById('btnPrev').disabled = (index === 0);
      document.getElementById('btnNext').disabled = (index === slidesData.length - 1);

      // 重置行解析條為預設狀態
      resetLineBar();
    }

    /* 程式碼懸停連動 */
    function onLineHover(lineNum) {
      const slide = slidesData[currentSlide];
      const lineData = slide.codeLines.find(l => l.num === lineNum);
      if (lineData) {
        updateLineBar(lineData.num, lineData.mean, lineData.why, lineData.alt);
      }
    }

    function onLineLeave() {
      resetLineBar();
    }

    /* 重點說明懸停聯動高亮 */
    function highlightLines(lineNums) {
      clearHighlightedLines();
      if (!Array.isArray(lineNums)) return;
      lineNums.forEach(num => {
        const el = document.getElementById(`code-line-${num}`);
        if (el) el.classList.add('linked-highlight');
      });

      if (lineNums.length > 0) {
        const slide = slidesData[currentSlide];
        const firstLine = slide.codeLines.find(l => l.num === lineNums[0]);
        if (firstLine) {
          updateLineBar(firstLine.num, firstLine.mean, firstLine.why, firstLine.alt);
        }
      }
    }

    function clearHighlightedLines() {
      document.querySelectorAll('.code-line.linked-highlight').forEach(el => {
        el.classList.remove('linked-highlight');
      });
      resetLineBar();
    }

    /* 更新三維說明列 */
    function updateLineBar(num, mean, why, alt) {
      const bar = document.getElementById('codeLineBar');
      bar.innerHTML = `
        <div class="bar-row">
          <span class="bar-badge badge-mean">第 ${num} 行含義</span>
          <span>${mean}</span>
        </div>
        <div class="bar-row">
          <span class="bar-badge badge-why">為何這樣寫</span>
          <span>${why}</span>
          <span class="bar-badge badge-alt" style="margin-left:8px;">還可怎麼寫</span>
          <span>${alt}</span>
        </div>
      `;
    }

    function resetLineBar() {
      const bar = document.getElementById('codeLineBar');
      bar.innerHTML = `
        <div class="bar-row" style="color: #94a3b8;">
          <span>💡 <strong>三維解析列：</strong>滑鼠懸停於任一行或右側重點，可即時探索【白話含義】、【為何這樣寫】與【還可以怎麼寫】。</span>
        </div>
      `;
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function toggleFullscreen() {
      const elem = document.getElementById('slideStage');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
          alert(`全螢幕切換失敗: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // 鍵盤切換支援
    window.addEventListener('keydown', (e) => {
      const sectionId = document.getElementById('sectionSelect').value;
      if (sectionId !== 'sec1-1') return;

      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 't' || e.key === 'T') {
        toggleTheme();
      }
    });

    // 啟動初始化
    initThemeFromSession();
    initCurriculumSelects();
  </script>
</body>
</html>
